name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Grant GITHUB_TOKEN write access to packages for GHCR publication
permissions:
  contents: read
  packages: write

jobs:
  # 1. CI (Continuous Integration) - Build, Lint Syntax, and Run Unit Tests
  ci:
    name: Continuous Integration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Code Syntax Validation Check
        run: |
          echo "Verifying syntax of all JavaScript files..."
          find . -name "*.js" -not -path "*/node_modules/*" -exec node --check {} \;
          echo "All JavaScript files are syntactically valid."

      # - name: Run Unit Tests
      #   run: npm test

      - name: Set up Docker Buildx (for Docker Smoke Test)
        uses: docker/setup-buildx-action@v3

      - name: Docker Build Smoke Test
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: redirection-service:test

  # 2. CD (Continuous Deployment) - Build and Push Production Docker Image to GHCR
  cd:
    name: Continuous Deployment (GHCR Build & Push)
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Metadata (Tags and Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and Push Docker Image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
